[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-publisher"
version = "0.1.0"
description = "Fail-closed Notion to WeChat Official Account draft publisher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Markdown>=3.6,<4",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mp-publisher = "mp_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
